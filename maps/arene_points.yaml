# Points nommés de la carte « arene » (arene.yaml).
# Un fichier de points par carte : les coordonnées n'ont de sens que sur leur carte.
#   x, y  : position en mètres, dans le repère de la carte (frame « map »)
#   theta : orientation du robot à l'arrivée, en radians (0 = vers +x)
# Relevés avec RViz → Publish Point + « ros2 topic echo /clicked_point ».

points:
  alpha: {x: 0.56, y: 2.08, theta: 0.0}
  beta:  {x: 2.56, y: 2.01, theta: 0.0}
  gamma: {x: 3.37, y: -1.08, theta: 0.0}

# Ordre de passage en mode PATROUILLE (la boucle revient ensuite au premier).
patrouille: [alpha, beta, gamma]
